services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: qna_docker
      POSTGRES_USER: qna_user
      POSTGRES_PASSWORD: qna_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qna_user -d qna_docker"]
      interval: 2s
      timeout: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DB_NAME: qna_docker
      DB_USER: qna_user
      DB_PASSWORD: qna_pass
      DB_HOST: db
      SECRET_KEY: "django-insecure-change-in-production-1234567890"
      DEBUG: "1"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
    command: >
      sh -c "python manage.py migrate --no-input &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  postgres_data:
